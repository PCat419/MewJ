# /etc/nginx/sites-available/mewj
# 1. 把 your.domain.tld 换成你的域名
# 2. htpasswd -c /etc/nginx/mewj.htpasswd youruser
# 3. certbot --nginx -d your.domain.tld

server {
    listen 80;
    server_name your.domain.tld;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name your.domain.tld;

    # certbot 会改写下面两行；首次可用自签证书占位后再跑 certbot
    ssl_certificate     /etc/letsencrypt/live/your.domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.tld/privkey.pem;

    # 基础鉴权（保护雀魂账号能力）
    auth_basic           "MewJ";
    auth_basic_user_file /etc/nginx/mewj.htpasswd;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 检讨可能较久，放宽超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
